name: Deploy to production

# Auto-deploy whenever main is updated, plus a manual "Run workflow" button.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys run at once; cancel an in-progress one if a newer push lands.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    steps:
      - name: Run deploy.sh on the server over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 20m
          script_stop: true
          script: |
            export APP_DIR="${APP_DIR:-/var/www/skelapp.tz}"
            export DEPLOY_BRANCH=main
            bash "$APP_DIR/deploy.sh"
